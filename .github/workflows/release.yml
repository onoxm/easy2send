name: Release CI
on:
  push:
    tags:
      - 'v*'

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: '--target aarch64-apple-darwin'
          - platform: 'ubuntu-22.04'
            args: ''
          - platform: 'windows-latest'
            args: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin' || '' }}

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      - name: Install frontend dependencies
        run: pnpm install --config.ignore-scripts=false

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'App v__VERSION__'
          releaseBody: 'See the assets to download this version and install.'
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      - name: Upload artifacts to public repository
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.PUBLIC_REPO_TOKEN }}
        run: |
          PUBLIC_REPO="onoxm/easy2send-updates"
          TAG_NAME="${{ github.ref_name }}"
          BUNDLE_DIR="src-tauri/target/release/bundle"

          # 确保公开仓库的 Release 存在
          gh release view "$TAG_NAME" --repo "$PUBLIC_REPO" || \
            gh release create "$TAG_NAME" --repo "$PUBLIC_REPO" \
              --title "$TAG_NAME" \
              --notes "Automated update artifacts"

          # 上传 Windows 产物
          gh release upload "$TAG_NAME" "$BUNDLE_DIR/nsis/"*.exe* --repo "$PUBLIC_REPO" --clobber || true
          gh release upload "$TAG_NAME" "$BUNDLE_DIR/msi/"*.msi* --repo "$PUBLIC_REPO" --clobber || true

          # 上传 macOS 产物
          gh release upload "$TAG_NAME" "$BUNDLE_DIR/dmg/"*.dmg* --repo "$PUBLIC_REPO" --clobber || true
          gh release upload "$TAG_NAME" "$BUNDLE_DIR/macos/"*.app.tar.gz* --repo "$PUBLIC_REPO" --clobber || true

          # 上传 Linux 产物
          gh release upload "$TAG_NAME" "$BUNDLE_DIR/appimage/"*.AppImage* --repo "$PUBLIC_REPO" --clobber || true
          gh release upload "$TAG_NAME" "$BUNDLE_DIR/deb/"*.deb* --repo "$PUBLIC_REPO" --clobber || true
          gh release upload "$TAG_NAME" "$BUNDLE_DIR/rpm/"*.rpm* --repo "$PUBLIC_REPO" --clobber || true

          # 上传 latest.json
          gh release upload "$TAG_NAME" "$BUNDLE_DIR/../latest.json" --repo "$PUBLIC_REPO" --clobber || true