name: Release CI
on:
  push:
    tags:
      - 'v*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: '--target aarch64-apple-darwin'
            target: 'aarch64-apple-darwin'
          - platform: 'ubuntu-22.04'
            args: ''
            target: ''
          - platform: 'windows-latest'
            args: ''
            target: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin' || '' }}

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'src-tauri -> target'

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf xdg-utils

      - name: Install frontend dependencies
        run: pnpm install --config.ignore-scripts=false

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'App v__VERSION__'
          releaseBody: 'See the assets to download this version and install.'
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      - name: Upload artifacts to public repository
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.PUBLIC_REPO_TOKEN }}
        run: |
          shopt -s nullglob

          PUBLIC_REPO="onoxm/easy2send-updates"
          TAG_NAME="${{ github.ref_name }}"
          TARGET="${{ matrix.target }}"

          # 根据 --target 计算产物目录：有 target 时产物在 target/<triple>/release 下
          if [ -n "$TARGET" ]; then
            BUNDLE_DIR="src-tauri/target/$TARGET/release/bundle"
          else
            BUNDLE_DIR="src-tauri/target/release/bundle"
          fi

          # 创建 Release（已存在时忽略，避免并行 job 竞态）
          gh release create "$TAG_NAME" --repo "$PUBLIC_REPO" \
            --title "$TAG_NAME" \
            --notes "Automated update artifacts" 2>/dev/null || true

          UPLOAD_FAILED=0

          # 仅在文件存在时上传；无匹配文件仅告警，真实错误才标记失败
          # 注意：pattern 必须整体加引号，否则 nullglob 会在调用处展开并销毁模式
          upload_files() {
            local pattern="$1"
            local files=($pattern)
            if [ ${#files[@]} -gt 0 ]; then
              if ! gh release upload "$TAG_NAME" "${files[@]}" --repo "$PUBLIC_REPO" --clobber; then
                echo "::error::Upload failed: $pattern"
                UPLOAD_FAILED=1
              fi
            else
              echo "⚠ No files matched: $pattern"
            fi
          }

          # Windows 产物
          upload_files "$BUNDLE_DIR/nsis/*.exe*"
          upload_files "$BUNDLE_DIR/msi/*.msi*"

          # macOS 产物
          upload_files "$BUNDLE_DIR/dmg/*.dmg*"
          upload_files "$BUNDLE_DIR/macos/*.app.tar.gz*"

          # Linux 产物
          upload_files "$BUNDLE_DIR/appimage/*.AppImage*"
          upload_files "$BUNDLE_DIR/deb/*.deb*"
          upload_files "$BUNDLE_DIR/rpm/*.rpm*"

          if [ "$UPLOAD_FAILED" -eq 1 ]; then
            exit 1
          fi

  # 所有平台构建完成后，从源仓库 Release 下载合并后的 latest.json 并同步到公开仓库
  publish-latest-json:
    needs: publish-tauri
    if: always()
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Republish latest.json to public repository
        shell: bash
        run: |
          set -x

          TAG_NAME="${{ github.ref_name }}"
          SOURCE_REPO="${{ github.repository }}"
          PUBLIC_REPO="onoxm/easy2send-updates"
          SOURCE_TOKEN="${{ secrets.GITHUB_TOKEN }}"
          PUBLIC_TOKEN="${{ secrets.PUBLIC_REPO_TOKEN }}"

          # 从源仓库 Release 下载 tauri-action 生成的 latest.json
          echo "=== Step 1: Download latest.json from source repo ==="
          if ! GH_TOKEN="$SOURCE_TOKEN" gh release download "$TAG_NAME" \
            --repo "$SOURCE_REPO" --pattern "latest.json" --dir /tmp --clobber; then
            echo "⚠ latest.json not found in source release, skipping"
            exit 0
          fi

          if [ ! -f /tmp/latest.json ]; then
            echo "::error::Download exited 0 but /tmp/latest.json does not exist"
            exit 1
          fi

          echo "=== Original latest.json ==="
          cat /tmp/latest.json

          # 获取源仓库 Release 的 assets（id → name 映射）
          echo "=== Step 2: Fetch asset map ==="
          ASSET_MAP=$(GH_TOKEN="$SOURCE_TOKEN" gh api "repos/$SOURCE_REPO/releases/tags/$TAG_NAME" \
            --jq '.assets | map({(.id|tostring): .name}) | add' 2>/dev/null || echo '{}')
          echo "Asset map: $ASSET_MAP"

          if [ "$ASSET_MAP" = "null" ] || [ -z "$ASSET_MAP" ]; then
            ASSET_MAP='{}'
          fi

          # 重写 URL
          echo "=== Step 3: Rewrite URLs ==="
          if ! jq --arg public_repo "$PUBLIC_REPO" --arg tag "$TAG_NAME" --argjson asset_map "$ASSET_MAP" '
            .platforms |= with_entries(
              .value.url |= sub(
                "https://api\\.github\\.com/repos/[^/]+/[^/]+/releases/assets/(?<id>[0-9]+)";
                "https://github.com/\($public_repo)/releases/download/\($tag)/" + ($asset_map[$id] // "unknown")
              )
            )
          ' /tmp/latest.json > /tmp/latest_fixed.json; then
            echo "::error::jq failed to process latest.json"
            exit 1
          fi

          if [ ! -s /tmp/latest_fixed.json ]; then
            echo "::error::latest_fixed.json is empty"
            exit 1
          fi

          mv /tmp/latest_fixed.json /tmp/latest.json

          echo "=== Fixed latest.json ==="
          cat /tmp/latest.json

          # 确保公开仓库 Release 存在
          echo "=== Step 4: Ensure public release exists ==="
          GH_TOKEN="$PUBLIC_TOKEN" gh release create "$TAG_NAME" --repo "$PUBLIC_REPO" \
            --title "$TAG_NAME" --notes "Automated update artifacts" 2>/dev/null || true

          # 上传到公开仓库
          echo "=== Step 5: Upload to public repo ==="
          GH_TOKEN="$PUBLIC_TOKEN" gh release upload "$TAG_NAME" \
            /tmp/latest.json --repo "$PUBLIC_REPO" --clobber
