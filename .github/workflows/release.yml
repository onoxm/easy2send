name: Release CI
on:
  push:
    tags:
      - 'v*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: '--target aarch64-apple-darwin'
            target: 'aarch64-apple-darwin'
          - platform: 'ubuntu-22.04'
            args: ''
            target: ''
          - platform: 'windows-latest'
            args: ''
            target: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin' || '' }}

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'src-tauri -> target'

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf xdg-utils

      - name: Install frontend dependencies
        run: pnpm install --config.ignore-scripts=false

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'App v__VERSION__'
          releaseBody: 'See the assets to download this version and install.'
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      - name: Upload artifacts to public repository
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.PUBLIC_REPO_TOKEN }}
        run: |
          shopt -s nullglob

          PUBLIC_REPO="onoxm/easy2send-updates"
          TAG_NAME="${{ github.ref_name }}"
          TARGET="${{ matrix.target }}"

          # 根据 --target 计算产物目录：有 target 时产物在 target/<triple>/release 下
          if [ -n "$TARGET" ]; then
            RELEASE_DIR="src-tauri/target/$TARGET/release"
          else
            RELEASE_DIR="src-tauri/target/release"
          fi
          BUNDLE_DIR="$RELEASE_DIR/bundle"

          # 创建 Release（已存在时忽略，避免并行 job 竞态）
          gh release create "$TAG_NAME" --repo "$PUBLIC_REPO" \
            --title "$TAG_NAME" \
            --notes "Automated update artifacts" 2>/dev/null || true

          UPLOAD_FAILED=0

          # 仅在文件存在时上传；无匹配文件仅告警，真实错误才标记失败
          upload_files() {
            local pattern="$1"
            local files=($pattern)
            if [ ${#files[@]} -gt 0 ]; then
              if ! gh release upload "$TAG_NAME" "${files[@]}" --repo "$PUBLIC_REPO" --clobber; then
                echo "::error::Upload failed: $pattern"
                UPLOAD_FAILED=1
              fi
            else
              echo "⚠ No files matched: $pattern"
            fi
          }

          # Windows 产物
          upload_files "$BUNDLE_DIR/nsis/"*.exe*
          upload_files "$BUNDLE_DIR/msi/"*.msi*

          # macOS 产物
          upload_files "$BUNDLE_DIR/dmg/"*.dmg*
          upload_files "$BUNDLE_DIR/macos/"*.app.tar.gz*

          # Linux 产物
          upload_files "$BUNDLE_DIR/appimage/"*.AppImage*
          upload_files "$BUNDLE_DIR/deb/"*.deb*
          upload_files "$BUNDLE_DIR/rpm/"*.rpm*

          # 更新清单
          upload_files "$RELEASE_DIR/latest.json"

          if [ "$UPLOAD_FAILED" -eq 1 ]; then
            exit 1
          fi
