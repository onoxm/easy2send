name: Release CI
on:
  push:
    tags:
      - 'v*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: '--target aarch64-apple-darwin'
            target: 'aarch64-apple-darwin'
          - platform: 'ubuntu-22.04'
            args: ''
            target: ''
          - platform: 'windows-latest'
            args: ''
            target: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          # 必须取完整历史：Generate release notes 要按「上一个 tag..HEAD」取提交，
          # 默认的 fetch-depth: 1 不带历史也不带 tag，range 会取空。
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Generate release notes
        id: notes
        shell: bash
        run: |
          # 生成的内容会经 tauri-action 写进 latest.json 的 notes 字段，
          # 最终显示在应用内的更新弹窗上，所以必须是给人看的描述而非样板话术。
          # 放在 Setup Node.js 之后：脚本用 Node 剥 emoji（见脚本内注释）。
          node scripts/release-notes.mjs > /tmp/release-notes.md
          echo "=== Release notes ==="
          cat /tmp/release-notes.md
          {
            echo 'body<<RELEASE_NOTES_EOF'
            cat /tmp/release-notes.md
            echo 'RELEASE_NOTES_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin' || '' }}

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'src-tauri -> target'

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf xdg-utils

      - name: Install frontend dependencies
        run: pnpm install --config.ignore-scripts=false

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'App v__VERSION__'
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      - name: Upload artifacts to public repository
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.PUBLIC_REPO_TOKEN }}
        run: |
          shopt -s nullglob

          PUBLIC_REPO="onoxm/easy2send-updates"
          TAG_NAME="${{ github.ref_name }}"
          TARGET="${{ matrix.target }}"

          # 根据 --target 计算产物目录：有 target 时产物在 target/<triple>/release 下
          if [ -n "$TARGET" ]; then
            BUNDLE_DIR="src-tauri/target/$TARGET/release/bundle"
          else
            BUNDLE_DIR="src-tauri/target/release/bundle"
          fi

          # 创建 Release（已存在时忽略，避免并行 job 竞态）
          # --latest 必须显式指定：GitHub 自动判定 Latest 依赖 created_at，而 created_at 是
          # tag 所指 commit 的日期——本仓库所有版本 tag 都由 gh 建在同一个 main HEAD 上，
          # created_at 完全相同，日期排序失效，只能退化到未公开的版本号兜底规则
          gh release create "$TAG_NAME" --repo "$PUBLIC_REPO" \
            --title "$TAG_NAME" \
            --notes-file /tmp/release-notes.md --latest 2>/dev/null || true

          UPLOAD_FAILED=0

          # 仅在文件存在时上传；无匹配文件仅告警，真实错误才标记失败
          # 注意：pattern 必须整体加引号，否则 nullglob 会在调用处展开并销毁模式
          upload_files() {
            local pattern="$1"
            local files=($pattern)
            if [ ${#files[@]} -gt 0 ]; then
              if ! gh release upload "$TAG_NAME" "${files[@]}" --repo "$PUBLIC_REPO" --clobber; then
                echo "::error::Upload failed: $pattern"
                UPLOAD_FAILED=1
              fi
            else
              echo "⚠ No files matched: $pattern"
            fi
          }

          # Windows 产物
          upload_files "$BUNDLE_DIR/nsis/*.exe*"
          upload_files "$BUNDLE_DIR/msi/*.msi*"

          # macOS 产物
          upload_files "$BUNDLE_DIR/dmg/*.dmg*"

          # macOS .app.tar.gz（Tauri 默认产物名不含版本号和架构，需重命名后上传）
          # 原名: Easy2Send.app.tar.gz → 重命名为: Easy2Send_0.2.2_aarch64.app.tar.gz
          MACOS_DIR="$BUNDLE_DIR/macos"
          if ls "$MACOS_DIR"/*.app.tar.gz 1>/dev/null 2>&1; then
            VERSION="${TAG_NAME#v}"
            ARCH=$([ -n "$TARGET" ] && echo "aarch64" || echo "x64")
            mkdir -p /tmp/macos-upload
            for f in "$MACOS_DIR"/*.app.tar.gz "$MACOS_DIR"/*.app.tar.gz.sig; do
              [ -f "$f" ] || continue
              base=$(basename "$f")
              product="${base%%.*}"
              rest="${base#*.}"
              new_name="${product}_${VERSION}_${ARCH}.${rest}"
              cp "$f" "/tmp/macos-upload/$new_name"
              echo "Renamed: $base → $new_name"
            done
            upload_files "/tmp/macos-upload/*.app.tar.gz*"
          fi

          # Linux 产物
          upload_files "$BUNDLE_DIR/appimage/*.AppImage*"
          upload_files "$BUNDLE_DIR/deb/*.deb*"
          upload_files "$BUNDLE_DIR/rpm/*.rpm*"

          if [ "$UPLOAD_FAILED" -eq 1 ]; then
            exit 1
          fi

  # 所有平台构建完成后，从源仓库 Release 下载合并后的 latest.json 并同步到公开仓库
  publish-latest-json:
    needs: publish-tauri
    if: always()
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Republish latest.json to public repository
        shell: bash
        run: |
          set -x

          TAG_NAME="${{ github.ref_name }}"
          SOURCE_REPO="${{ github.repository }}"
          PUBLIC_REPO="onoxm/easy2send-updates"
          SOURCE_TOKEN="${{ secrets.GITHUB_TOKEN }}"
          PUBLIC_TOKEN="${{ secrets.PUBLIC_REPO_TOKEN }}"

          # 从源仓库 Release 下载 tauri-action 生成的 latest.json
          echo "=== Step 1: Download latest.json from source repo ==="
          if ! GH_TOKEN="$SOURCE_TOKEN" gh release download "$TAG_NAME" \
            --repo "$SOURCE_REPO" --pattern "latest.json" --dir /tmp --clobber; then
            echo "⚠ latest.json not found in source release, skipping"
            exit 0
          fi

          if [ ! -f /tmp/latest.json ]; then
            echo "::error::Download exited 0 but /tmp/latest.json does not exist"
            exit 1
          fi

          echo "=== Original latest.json ==="
          cat /tmp/latest.json

          # 重写 URL：用版本号 + 平台→文件名规则直接构造公开仓库下载地址
          # 不依赖 asset map（gh release view --json 返回 GraphQL node ID，与 URL 中的数字 ID 不匹配）
          echo "=== Step 2: Rewrite URLs ==="
          if ! jq --arg public_repo "$PUBLIC_REPO" --arg tag "$TAG_NAME" '
            .version as $v |
            {
              "darwin-aarch64": "Easy2Send_\($v)_aarch64.dmg",
              "darwin-aarch64-app": "Easy2Send_\($v)_aarch64.app.tar.gz",
              "windows-x86_64": "Easy2Send_\($v)_x64_en-US.msi",
              "windows-x86_64-msi": "Easy2Send_\($v)_x64_en-US.msi",
              "windows-x86_64-nsis": "Easy2Send_\($v)_x64-setup.exe",
              "linux-x86_64": "Easy2Send_\($v)_amd64.AppImage",
              "linux-x86_64-appimage": "Easy2Send_\($v)_amd64.AppImage",
              "linux-x86_64-deb": "Easy2Send_\($v)_amd64.deb",
              "linux-x86_64-rpm": "Easy2Send-\($v)-1.x86_64.rpm"
            } as $platform_files |
            .platforms |= with_entries(
              if $platform_files[.key] then
                .value.url = "https://github.com/\($public_repo)/releases/download/\($tag)/\($platform_files[.key])"
              else
                .
              end
            )
          ' /tmp/latest.json > /tmp/latest_fixed.json; then
            echo "::error::jq failed to process latest.json"
            exit 1
          fi

          if [ ! -s /tmp/latest_fixed.json ]; then
            echo "::error::latest_fixed.json is empty"
            exit 1
          fi

          mv /tmp/latest_fixed.json /tmp/latest.json

          echo "=== Fixed latest.json ==="
          cat /tmp/latest.json

          # 确保公开仓库 Release 存在。公开仓库是用户实际下载的入口，说明不能留样板话术：
          # 优先从源仓库 Release 取回真实说明（由 tauri-action 的 releaseBody 写入），
          # 取不到就保持现状，不覆盖成占位文本。
          echo "=== Step 3: Ensure public release exists ==="
          NOTES_FILE=/tmp/public-notes.md
          NOTES_ARGS=()
          if GH_TOKEN="$SOURCE_TOKEN" gh release view "$TAG_NAME" --repo "$SOURCE_REPO" \
            --json body -q .body > "$NOTES_FILE" 2>/dev/null && [ -s "$NOTES_FILE" ]; then
            echo "已取到源仓库更新说明："
            cat "$NOTES_FILE"
            NOTES_ARGS=(--notes-file "$NOTES_FILE")
          else
            echo "⚠ 未取到源仓库更新说明"
            rm -f "$NOTES_FILE"
          fi

          if GH_TOKEN="$PUBLIC_TOKEN" gh release create "$TAG_NAME" --repo "$PUBLIC_REPO" \
            --title "$TAG_NAME" "${NOTES_ARGS[@]}" 2>/dev/null; then
            echo "已创建公开仓库 Release"
          elif [ ${#NOTES_ARGS[@]} -gt 0 ]; then
            GH_TOKEN="$PUBLIC_TOKEN" gh release edit "$TAG_NAME" --repo "$PUBLIC_REPO" \
              --notes-file "$NOTES_FILE"
            echo "公开仓库 Release 已存在，已同步更新说明"
          else
            echo "公开仓库 Release 已存在，无可用说明，保持原样"
          fi

          # 上传到公开仓库
          echo "=== Step 4: Upload to public repo ==="
          GH_TOKEN="$PUBLIC_TOKEN" gh release upload "$TAG_NAME" \
            /tmp/latest.json --repo "$PUBLIC_REPO" --clobber

          # 收尾时再强制标一次 Latest：上面矩阵 job 里的 create 只要撞上已存在的 release 就会
          # 失败（被 || true 吞掉），--latest 也随之丢失；这里在唯一一个 job 里兜底，
          # 保证 /releases/latest/download/latest.json 永远指向刚发布的版本
          echo "=== Step 5: Force mark as latest ==="
          GH_TOKEN="$PUBLIC_TOKEN" gh release edit "$TAG_NAME" \
            --repo "$PUBLIC_REPO" --latest

      # 收尾正式发布源仓库的草稿：tauri-action 以 draft 创建 release，而 draft 永远不可能
      # 被标成 Latest（GitHub 硬规则），必须手动或在这里自动 Publish —— 这就是「工作流跑完
      # 但最新版没变成 latest」的原因。用 needs 结果判断，保证只在三平台全成功时才公开
      - name: Publish source draft release
        if: needs.publish-tauri.result == 'success'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="${{ github.ref_name }}"
          gh release edit "$TAG_NAME" --repo "${{ github.repository }}" \
            --draft=false --latest
          echo "Published $TAG_NAME on ${{ github.repository }} and marked as latest"
