<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <!-- theme-color 交给脚本按"最终生效的主题"更新：加了手动切换之后，
         按 media 查询声明的那两条会写反（手动选了浅色、系统却是深色时）。 -->
    <meta name="theme-color" content="#ffffff" />
    <script>
      // 尽早把主题落到 <html>：否则深色用户会先看到一帧浅色再翻转。
      // 必须是内联的阻塞脚本，放到 body 末尾的 script.js 里就太晚了。
      try {
        var m = localStorage.getItem('e2s-theme')
        if (m === 'light' || m === 'dark') {
          document.documentElement.dataset.theme = m
        }
        // 没手选（或选了跟随系统）时看系统偏好；theme-color 跟着最终结果走
        var dark =
          m === 'dark' ||
          (m !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)
        if (dark) {
          document
            .querySelector('meta[name="theme-color"]')
            .setAttribute('content', '#0f1218')
        }
      } catch (e) {
        // localStorage 可能被禁用（隐私模式）—— 那就退回纯系统跟随
      }
    </script>
    <title>Easy2Send · 网页上传</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <main class="page">
      <!-- 三态主题切换：跟随系统 → 浅色 → 深色 循环，逻辑在 script.js。
           浮在右上角、不占 .stack 的布局，所以设计稿的版面账不受影响。 -->
      <button
        class="theme-toggle"
        id="themeToggle"
        type="button"
        aria-label="切换主题"
        title="切换主题"
      >
        <!-- 跟随系统：半明半暗的圆 -->
        <svg
          class="icon-theme-auto"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <circle cx="12" cy="12" r="9" />
          <path d="M12 3a9 9 0 0 1 0 18z" fill="currentColor" stroke="none" />
        </svg>
        <!-- 浅色：太阳 -->
        <svg
          class="icon-theme-light"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <circle cx="12" cy="12" r="5" />
          <path d="M12 1v2" />
          <path d="M12 21v2" />
          <path d="M4.22 4.22l1.42 1.42" />
          <path d="M18.36 18.36l1.42 1.42" />
          <path d="M1 12h2" />
          <path d="M21 12h2" />
          <path d="M4.22 19.78l1.42-1.42" />
          <path d="M18.36 5.64l1.42-1.42" />
        </svg>
        <!-- 深色：月亮 -->
        <svg
          class="icon-theme-dark"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
        </svg>
      </button>

      <div class="stack">
        <!-- 品牌区 -->
        <header class="brand">
          <div class="brand-logo" aria-hidden="true">
            <svg
              viewBox="0 0 26 26"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M13 17V5" />
              <path d="M8.5 9.5 13 5l4.5 4.5" />
              <path d="M5 21h16" />
            </svg>
          </div>
          <h1 class="brand-name">Easy2Send</h1>
          <p class="brand-tagline" id="tagline">扫码访问，文件直达电脑</p>
        </header>

        <!-- 状态卡片：配对中 / 已连接 / 配对失败 三种形态 -->
        <section class="state-card" id="stateCard" aria-live="polite">
          <div class="state-card-icon">
            <span class="spinner"></span>
            <svg
              class="icon-check"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2.2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M6 12.5 10 16.5 18 7.5" />
            </svg>
            <svg
              class="icon-alert"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2.2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M12 6v8" />
              <circle
                cx="12"
                cy="18"
                r="1.4"
                fill="currentColor"
                stroke="none"
              />
            </svg>
          </div>
          <p class="state-card-title" id="stateTitle">正在配对...</p>
          <p class="state-card-hint" id="stateHint">
            请稍候，正在与电脑建立连接
          </p>
        </section>

        <!-- 完成卡片 -->
        <section class="done-card is-hidden" id="doneCard" aria-live="polite">
          <div class="done-card-icon" aria-hidden="true">
            <svg
              viewBox="0 0 28 28"
              fill="none"
              stroke="currentColor"
              stroke-width="2.4"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M7 14.5 12 19.5 21 9" />
            </svg>
          </div>
          <p class="done-card-title" id="doneTitle"></p>
          <p class="done-card-hint" id="doneHint"></p>
        </section>

        <!-- 文件列表 -->
        <div class="file-list is-hidden" id="fileList"></div>

        <!-- 上传区 -->
        <div class="upload-area is-hidden" id="uploadArea">
          <button class="btn btn-primary" id="pickBtn" type="button">
            <svg
              class="btn-icon"
              viewBox="0 0 20 20"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M10 13.5V4" />
              <path d="M6.5 7.5 10 4l3.5 3.5" />
              <path d="M4 16.5h12" />
            </svg>
            选择文件
          </button>
          <p class="upload-hint">可一次选择多个文件</p>
        </div>

        <!-- 配对失败后的重试 -->
        <button class="btn btn-secondary is-hidden" id="retryBtn" type="button">
          <svg
            class="btn-icon"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="M4.6 9.6A8 8 0 0 1 18 7.4" />
            <path d="M18 3.6v3.9h-3.9" />
            <path d="M19.4 14.4A8 8 0 0 1 6 16.6" />
            <path d="M6 20.4v-3.9h3.9" />
          </svg>
          重新扫描二维码
        </button>

        <!-- 底部信息 -->
        <footer class="meta">
          <p class="meta-line">局域网直连 · 安全传输</p>
          <p class="meta-line meta-line-dim" id="metaNote">单文件最大 10GB</p>
        </footer>
      </div>
    </main>

    <!-- 文件项模板：三种形态（上传中 / 等待中 / 已完成）只靠 class 切换 -->
    <template id="fileItemTemplate">
      <div class="file-item is-waiting">
        <div class="file-item-icon">
          <svg
            class="icon-file"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="M14 3v4a1 1 0 0 0 1 1h4" />
            <path
              d="M17 21H7a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h7l5 5v11a2 2 0 0 1-2 2z"
            />
          </svg>
          <svg
            class="icon-check"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2.2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="M6 12.5 10 16.5 18 7.5" />
          </svg>
        </div>
        <div class="file-item-info">
          <p class="file-item-name"></p>
          <div class="file-item-bar"
            ><div class="file-item-bar-fill"></div
          ></div>
          <p class="file-item-status"></p>
        </div>
      </div>
    </template>

    <input type="file" id="fileInput" multiple style="display: none" />
    <script src="/script.js"></script>
  </body>
</html>
